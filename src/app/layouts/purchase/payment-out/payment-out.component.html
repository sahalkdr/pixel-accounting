<!-- payment-out.component.html -->

<button mat-mini-fab (click)="navigateToAddPaymentOut()">
  <mat-icon>add</mat-icon>
</button>
<div class="date-picker">
  <mat-form-field>
    <mat-label>From:</mat-label>
    <input matInput [matDatepicker]="fromDatePicker" id="from-date" name="from-date" (dateInput)="filterByDateRange()">
    <mat-datepicker-toggle matSuffix [for]="fromDatePicker"></mat-datepicker-toggle>
    <mat-datepicker #fromDatePicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field>
    <mat-label>To:</mat-label>
    <input matInput [matDatepicker]="toDatePicker" id="to-date" name="to-date" (dateInput)="filterByDateRange()">
    <mat-datepicker-toggle matSuffix [for]="toDatePicker"></mat-datepicker-toggle>
    <mat-datepicker #toDatePicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Party Name:</mat-label>
    <input matInput type="text" id="party-name" name="party-name" (input)="filterByDateRange()">
  </mat-form-field>
</div>


  <div>
    <div>Total</div>
    <div>₹{{ totalPaidAmount.toFixed(2) }}</div>
  </div>
  


<div class="transactions" *ngIf="!noRecords; else noRecordsTemplate">
  <table class="normal-table">
    <thead>
      <tr>
        <th>Date</th>
        <!-- <th class="hide-on-small-screen">Purchase No.</th> -->
        <th>Party Name</th>
        <th>Amount</th>
        <!-- <th class="hide-on-small-screen">Payment Mode</th> -->
        <!-- <th class="hide-on-small-screen">Total Tax (Rs)</th> -->
        <!-- <th>Amount Received</th> -->
        <!-- <th class="show-on-small-screen">Info</th> -->
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let payment of (payment_out_details.payment_out || [] )| paginate: { itemsPerPage: itemsPerPage, currentPage: p }">
        <td>{{ payment.payment_date }}</td>
        <!-- <td class="hide-on-small-screen">{{ purchase.purchase_id }}</td> -->
        <td>{{ payment.customer_name || 'N/A' }}</td>            
        
        <td class="right-align hide-on-small-screen">{{ payment.amount }}</td>
        <!-- <td class="right-align">{{ bill.amount_received }}</td> -->
        <!-- <td>
          <button mat-icon-button (click)="editbill(purchase.purchase_id)">
            <mat-icon>edit</mat-icon>
          </button>
        </td> -->
        <!-- <td>
          <button mat-icon-button (click)="navigate(purchase.purchase_id)">
            <mat-icon>print</mat-icon>
          </button>
          </td> -->
        <!-- <td class="show-on-small-screen">
          <button mat-icon-button (click)="openDialog(purchase)">
            <mat-icon>info</mat-icon>
          </button>
        </td> -->
      </tr>
    </tbody>
  </table>
</div>

<ng-template #noRecordsTemplate>
  <div class="no-records">No records found.</div>
</ng-template>



<div class="pagination-container" *ngIf="!noRecords && payment_out_details.payment_out?.length">
<pagination-controls (pageChange)="p = $event"></pagination-controls>
</div>
